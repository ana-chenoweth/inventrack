services:
  db:
    image: postgres:16
    container_name: inventrack-db
    environment:
      POSTGRES_USER: inventrack
      POSTGRES_PASSWORD: inventrack
      POSTGRES_DB: inventrack
    ports:
      # Si ya tienes un Postgres local en el 5432, cambia a "5433:5432"
      # y ajusta DATABASE_URL.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los .sql de esta carpeta se ejecutan solo la primera vez que se crea el volumen.
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
